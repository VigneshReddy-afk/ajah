apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ajah.fullname" . }}-gateway
  labels:
    {{- include "ajah.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ajah.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "ajah.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway.repository }}:{{ .Values.image.gateway.tag }}"
          imagePullPolicy: {{ .Values.image.gateway.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.gateway.port }}
          envFrom:
            - configMapRef:
                name: {{ include "ajah.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ajah.fullname" . }}-gateway
  labels:
    {{- include "ajah.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.gateway.type }}
  ports:
    - port: {{ .Values.service.gateway.port }}
      targetPort: {{ .Values.service.gateway.port }}
  selector:
    {{- include "ajah.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
