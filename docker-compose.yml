version: "3.9"

services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres
      - clickhouse

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ajah
      POSTGRES_PASSWORD: ajah
      POSTGRES_DB: ajah
    ports:
      - "5432:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
